<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Service</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body data-endpoint="/api/orders" data-title="Orders">
    <nav>
      <div class="brand">Order Service</div>
      <div class="links">
        <a href="/">Home</a>
        <a href="/users">Users</a>
        <a href="/products">Products</a>
        <a href="/orders">Orders</a>
      </div>
    </nav>

    <main class="container">
      <section class="table-panel">
        <h2>Orders</h2>
        <span id="status" class="status">Loading orders...</span>
        <table id="items-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>User ID</th>
              <th>Product ID</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>
  </body>
</html>
