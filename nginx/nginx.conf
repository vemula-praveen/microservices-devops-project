
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location = /users {
        alias /usr/share/nginx/html/users.html;
        default_type text/html;
    }

    location = /products {
        alias /usr/share/nginx/html/products.html;
        default_type text/html;
    }

    location = /orders {
        alias /usr/share/nginx/html/orders.html;
        default_type text/html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/users {
        rewrite ^/api/users/?$ /users break;
        rewrite ^/api/users/(.*)$ /$1 break;
        proxy_pass http://user-service:3001;
    }

    location /api/products {
        rewrite ^/api/products/?$ /products break;
        rewrite ^/api/products/(.*)$ /$1 break;
        proxy_pass http://product-service:3002;
    }

    location /api/orders {
        rewrite ^/api/orders/?$ /orders break;
        rewrite ^/api/orders/(.*)$ /$1 break;
        proxy_pass http://order-service:3003;
    }
}
